# Produccion en una VPS: Caddy (HTTPS) -> API -> MySQL.
# Se usa desde /opt/agro en el servidor, junto a .env, Caddyfile y db/.
# Ver deploy/README.md.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ${API_IMAGE:-ghcr.io/jesus180reyes/core-control-calidad-agro-backend:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      PORT: 4000
      # Fijado aqui y no en .env: con cualquier otro valor se monta Swagger,
      # y /docs no pasa por el JwtAuthGuard.
      NODE_ENV: production
    # Sin "ports": solo Caddy la alcanza, por la red interna.
    expose:
      - "4000"
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # Sin "ports": MySQL no queda expuesto a internet. Para entrar desde tu
    # PC, usa un tunel SSH (ver README).
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
