# Produccion en una VPS: Caddy (HTTPS) -> API -> MySQL.
# Se usa desde /opt/agro en el servidor, junto a .env, Caddyfile y db/.
# Ver deploy/README.md.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      DOZZLE_DOMAIN: ${DOZZLE_DOMAIN}
      DOZZLE_USER: ${DOZZLE_USER}
      DOZZLE_PASSWORD_HASH: ${DOZZLE_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    image: ${API_IMAGE:-ghcr.io/jesus180reyes/core-control-calidad-agro-backend:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      PORT: 4000
      # No se lee NODE_ENV de .env a proposito: un .env copiado del local trae
      # NODE_ENV=development, y eso monta Swagger, cuyo /docs no pasa por el
      # JwtAuthGuard. API_NODE_ENV=development lo activa a conciencia: solo en dev.
      NODE_ENV: ${API_NODE_ENV:-production}
    # Sin "ports": solo Caddy la alcanza, por la red interna.
    expose:
      - "4000"
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # Hora de Honduras (UTC-6, sin horario de verano). La API ademas la fija en
    # cada sesion; esto cubre a quien consulte la base por fuera de la API.
    command: --default-time-zone=-06:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    # Por defecto solo escucha en el localhost del servidor: no queda expuesto
    # a internet y el tunel SSH apunta siempre a 127.0.0.1:3306. DB_BIND=0.0.0.0
    # en .env lo abre a internet (Docker se salta ufw): solo en dev, nunca en
    # produccion. Ver README, seccion 10.
    ports:
      - "${DB_BIND:-127.0.0.1}:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Visor web de los logs de los contenedores. Se entra por Caddy en
  # DOZZLE_DOMAIN, con basic_auth, o por tunel SSH al 127.0.0.1:8080. Ver
  # README, seccion 11.
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
