# Lo que existe una sola vez en la VPS: Caddy (HTTPS), MySQL compartido (una
# base por tenant) y Dozzle. Se usa desde /opt/plataforma, junto a
# .env, Caddyfile, tenants/, db/, backup.sh y nuevo-tenant.sh.
# Cada tenant es un compose aparte en /opt/<slug> (ver deploy/tenant/).
# Ver deploy/README.md.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOZZLE_DOMAIN: ${DOZZLE_DOMAIN}
      DOZZLE_USER: ${DOZZLE_USER}
      DOZZLE_PASSWORD_HASH: ${DOZZLE_PASSWORD_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Un <slug>.caddy por tenant, escrito por nuevo-tenant.sh.
      - ./tenants:/etc/caddy/tenants:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    # Hora de Honduras (UTC-6, sin horario de verano). La API ademas la fija en
    # cada sesion; esto cubre a quien consulte la base por fuera de la API.
    command: --default-time-zone=-06:00
    # Solo root: las bases y los usuarios de cada tenant los crea
    # nuevo-tenant.sh, nunca el arranque del contenedor.
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # Por defecto solo escucha en el localhost del servidor: no queda expuesto
    # a internet y el tunel SSH apunta siempre a 127.0.0.1:3306. DB_BIND=0.0.0.0
    # en .env lo abre a internet (Docker se salta ufw): solo en dev, nunca en
    # produccion. Ver README, seccion 10.
    ports:
      - "${DB_BIND:-127.0.0.1}:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Visor web de los logs de todos los contenedores (plataforma y tenants). Se
  # entra por Caddy en DOZZLE_DOMAIN, con basic_auth, o por tunel SSH al
  # 127.0.0.1:8080. Ver README, seccion 11.
  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }

# Red compartida con nombre fijo: los compose de los tenants se unen a ella
# como externa, y asi Caddy alcanza a api-<slug> y cada API alcanza a "mysql".
# Por eso esta plataforma se levanta antes que cualquier tenant.
networks:
  default:
    name: agro

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
